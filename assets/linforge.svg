<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  
  <!-- Outer Glow Hexagon / Anvil Base -->
  <path d="M136 340 L376 340 L340 400 L172 400 Z" fill="url(#forgeGrad)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Sleek Linux Penguin & Flame Silhouette -->
  <!-- Penguin Head / Body Arc -->
  <path d="M256 90 C 200 90, 160 140, 160 210 C 160 270, 140 310, 120 330 L 392 330 C 372 310, 352 270, 352 210 C 352 140, 312 90, 256 90 Z" fill="#090d16" stroke="#00e5ff" stroke-width="8"/>
  
  <!-- Penguin Belly Glow -->
  <ellipse cx="256" cy="235" rx="55" ry="75" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  
  <!-- Central Forge Flame -->
  <path d="M256 150 C 240 190, 210 220, 210 260 C 210 295, 230 320, 256 320 C 282 320, 302 295, 302 260 C 302 220, 272 190, 256 150 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <path d="M256 200 C 248 225, 232 245, 232 270 C 232 288, 243 300, 256 300 C 269 300, 280 288, 280 270 C 280 245, 264 225, 256 200 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Penguin Eyes -->
  <circle cx="230" cy="155" r="8" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="282" cy="155" r="8" fill="#00e5ff" filter="url(#glow)"/>
  
  <!-- Beak -->
  <polygon points="256,170 242,185 270,185" fill="#f59e0b"/>
</svg>
